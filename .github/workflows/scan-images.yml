name: Test Grype scan

on:
  push:
    branches:
      - main
      - scheduled-job-scans-multiple-repos
  workflow_dispatch:
    inputs:
      image:
        description: Full Artifact Registry image reference
        required: true
        default: europe-north1-docker.pkg.dev/dapla-metadata/ssb-dataportal:latest


permissions:
  security-events: write
  contents: read
  id-token: write
  packages: read
  actions: read
  pages: write


jobs:
  grype-scan:
    runs-on: ubuntu-latest

    
    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: "projects/${{ secrets.GAR_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/gh-actions/providers/gh-actions"
          service_account: "gh-actions-metadata-system@${{ secrets.GAR_PROJECT_ID }}.iam.gserviceaccount.com"
          token_format: access_token

      - name: Log in to Artifact Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: europe-north1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Scan image with Grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ inputs.image }}
          output-format: table
          fail-build: false